<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polydreams — Coming Soon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .logo {
            font-size: 3rem;
            font-weight: 800;
            color: #ff6b35;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .tagline {
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 40px;
        }
        .game-card {
            background: #15151f;
            border: 1px solid #2a2a3a;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            margin-bottom: 30px;
        }
        .game-title {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 10px;
        }
        .game-desc {
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .coming-soon {
            background: #ff6b35;
            color: #0a0a0f;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 1rem;
            display: inline-block;
        }
        .socials {
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }
        .socials a {
            color: #888;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .socials a:hover { color: #ff6b35; }
        .footer {
            margin-top: 60px;
            font-size: 0.8rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="logo">POLYDREAMS</div>
    <div class="tagline">Small studio. Big dreams. Dead zombies.</div>
    
    <div class="game-card">
        <div class="game-title">ROT HOLD</div>
        <div class="game-desc">
            A 2D pseudo-3D arcade roguelite tower defense game. 
            Defend your barricade against endless zombie hordes.
            Coming to Poki & CrazyGames.
        </div>
        <div class="coming-soon">COMING SOON</div>
    </div>
    
    <div class="socials">
        <a href="https://twitter.com/polydreams" target="_blank">Twitter/X</a>
        <a href="https://discord.gg/yourlink" target="_blank">Discord</a>
        <a href="mailto:hello@polydreams.games">Email</a>
    </div>
    
    <div class="footer">© 2026 Polydreams. All rights reserved.</div>
</body>
</html>
